name: CI

on:
  push:
    branches: [main]
  pull_request:

# No secrets on purpose: this job proves `npm test` needs no database and no
# API key. The eval gate (#9) is a separate job that does use the Anthropic key.
jobs:
  verify:
    name: typecheck + test + lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Lint
        run: npm run lint
